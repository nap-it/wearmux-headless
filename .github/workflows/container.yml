name: Publish container image

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.0 or v1.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $tag_pattern || ${#RELEASE_TAG} -gt 128 ]]; then
            echo "Expected a release tag such as v1.0.0 or v1.1.0-rc.1" >&2
            exit 1
          fi
          stable=true
          if [[ "$RELEASE_TAG" == *-* ]]; then
            stable=false
            IFS='.' read -r -a identifiers <<< "${RELEASE_TAG#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0* && ${#identifier} -gt 1 ]]; then
                echo "Numeric prerelease identifiers cannot have leading zeroes" >&2
                exit 1
              fi
            done
          fi
          image=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$image" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and publish AMD64 and ARM64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Use the public equivalent of the CodeNap base on GitHub-hosted runners.
          build-args: NODE_BASE_IMAGE=docker.io/library/node:22-bookworm-slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wearmux-headless-container
          cache-to: type=gha,mode=max,scope=wearmux-headless-container

      - name: Publish release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          title_file="docs/releases/$RELEASE_TAG.title.txt"
          title="Release $RELEASE_TAG"
          if [[ -s "$title_file" ]]; then
            title=$(cat "$title_file")
          fi
          args=(--verify-tag --title "$title")
          if [[ "$STABLE_RELEASE" == true ]]; then
            args+=(--prerelease=false --latest)
          else
            args+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if [[ -f "$notes" ]]; then
              gh release edit "$RELEASE_TAG" "${args[@]}" --notes-file "$notes"
            else
              echo "Release $RELEASE_TAG already exists; preserving its notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" "${args[@]}" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${args[@]}" --generate-notes
          fi
