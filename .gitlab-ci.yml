variables:
  DOCKERFILE_PATH: .
  DOCKERFILE_NAME: Dockerfile
  DOCKER_HOST: "unix:///var/run/docker.sock"

stages:
  - build
  - manifest
  - release
  - clean

before_script:
  - |
    if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
      DOCKER_TAG=latest
    else
      DOCKER_TAG="$CI_COMMIT_BRANCH"
    fi

build_amd64:
  stage: build
  image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/docker
  tags:
    - amd64
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        TAG_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH}"
        echo "Modifying Dockerfile to include version $TAG_VERSION"
        sed -i '/^ENTRYPOINT/i ENV VERSION='"$TAG_VERSION" "$DOCKERFILE_PATH/$DOCKERFILE_NAME"
        sed -i '/^ENTRYPOINT/i ENV COMMIT='"$CI_COMMIT_SHORT_SHA" "$DOCKERFILE_PATH/$DOCKERFILE_NAME"
      fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      docker buildx build \
        --builder default \
        --platform linux/amd64 \
        --provenance=false \
        --sbom=false \
        --load \
        -t "$CI_REGISTRY_IMAGE:$DOCKER_TAG-amd64" \
        -f "$DOCKERFILE_PATH/$DOCKERFILE_NAME" \
        "$DOCKERFILE_PATH"
    - |
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        docker push "$CI_REGISTRY_IMAGE:$DOCKER_TAG-amd64"
      fi
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"'
    - if: '$CI_COMMIT_BRANCH'

build_arm64:
  stage: build
  image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/docker
  tags:
    - arm64
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        TAG_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH}"
        echo "Modifying Dockerfile to include version $TAG_VERSION"
        sed -i '/^ENTRYPOINT/i ENV VERSION='"$TAG_VERSION" "$DOCKERFILE_PATH/$DOCKERFILE_NAME"
        sed -i '/^ENTRYPOINT/i ENV COMMIT='"$CI_COMMIT_SHORT_SHA" "$DOCKERFILE_PATH/$DOCKERFILE_NAME"
      fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      docker buildx build \
        --builder default \
        --platform linux/arm64 \
        --provenance=false \
        --sbom=false \
        --load \
        -t "$CI_REGISTRY_IMAGE:$DOCKER_TAG-arm64" \
        -f "$DOCKERFILE_PATH/$DOCKERFILE_NAME" \
        "$DOCKERFILE_PATH"
    - |
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        docker push "$CI_REGISTRY_IMAGE:$DOCKER_TAG-arm64"
      fi
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"'
    - if: '$CI_COMMIT_BRANCH'

manage_release:
  stage: release
  tags:
    - amd64
  image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/curlimages/curl:latest
  before_script:
    - curl --fail --location --output ~/release-cli "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64"
    - chmod +x ~/release-cli
  script:
    - |
      # Use the API token for release administration and latest Git tag writes.
      : "${CI_TOKEN:?Set CI_TOKEN with API write access to update the latest Git tag}"
      export GITLAB_PRIVATE_TOKEN="$CI_TOKEN"
      delete_if_present() {
        # GitLab can return 403 when DELETE targets a missing release.
        response_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
          --header "$2" "$1") || return 1
        case "$response_code" in
          404) echo "Already absent: $1"; return 0 ;;
          200) ;;
          *) echo "Lookup failed with HTTP $response_code for $1"; return 1 ;;
        esac
        response_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
          --request DELETE --header "$2" "$1") || return 1
        case "$response_code" in
          2??|404) return 0 ;;
          *) echo "Delete failed with HTTP $response_code for $1"; return 1 ;;
        esac
      }

      # Only calculate a previous patch for stable semantic version tags.
      if printf '%s\n' "$CI_COMMIT_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$' && [ "${CI_COMMIT_TAG##*.}" -gt 0 ]; then
        PREVIOUS_PATCH_VERSION=$(expr "${CI_COMMIT_TAG##*.}" - 1 || true)
        PREVIOUS_TAG="${CI_COMMIT_TAG%.*}.$PREVIOUS_PATCH_VERSION"
        echo "Deleting previous patch release $PREVIOUS_TAG"
        delete_if_present "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$PREVIOUS_TAG" "PRIVATE-TOKEN: $CI_TOKEN"
      fi

      release_notes="docs/releases/$CI_COMMIT_TAG.md"
      release_title="docs/releases/$CI_COMMIT_TAG.title.txt"
      release_name="Release $CI_COMMIT_TAG"
      release_description="Release files and assets for the version $CI_COMMIT_TAG"
      if [ -s "$release_title" ]; then
        release_name=$(cat "$release_title")
      fi
      if [ -f "$release_notes" ]; then
        release_description=$(cat "$release_notes")
      fi

      # A previous attempt may already have created the version release.
      release_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG"
      response_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
        --header "PRIVATE-TOKEN: $CI_TOKEN" "$release_url")
      case "$response_code" in
        200)
          if [ -f "$release_notes" ]; then
            echo "Updating release $CI_COMMIT_TAG from $release_notes"
            curl --fail --silent --show-error --output /dev/null \
              --request PUT --header "PRIVATE-TOKEN: $CI_TOKEN" \
              --data-urlencode "name=$release_name" \
              --data-urlencode "description@$release_notes" "$release_url"
          else
            echo "Release $CI_COMMIT_TAG already exists; preserving its description and assets"
          fi
          ;;
        404)
          echo "Creating new release for tag $CI_COMMIT_TAG"
          ~/release-cli create --name "$release_name" --description "$release_description" \
            --tag-name "$CI_COMMIT_TAG" --ref "$CI_COMMIT_TAG"
          ;;
        *) echo "Release lookup failed with HTTP $response_code for $release_url"; exit 1 ;;
      esac

      echo "Updating latest release"
      delete_if_present "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/latest" "PRIVATE-TOKEN: $CI_TOKEN"
      delete_if_present "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags/latest" "PRIVATE-TOKEN: $CI_TOKEN"
      echo "Creating Latest Release for version $CI_COMMIT_TAG"
      ~/release-cli create --name "Release Latest" --description "$release_description" \
        --tag-name "latest" --ref "$CI_COMMIT_TAG" \
        --assets-link "{\"name\":\"${CI_PROJECT_NAME}\",\"url\":\"https://${CI_REGISTRY_IMAGE}:latest\"}"
  dependencies:
    - build_amd64
    - build_arm64
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"'

create_manifest:
  stage: manifest
  image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/docker
  tags:
    - amd64
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      IMAGE_REF="$CI_REGISTRY_IMAGE:$DOCKER_TAG"
      docker buildx imagetools create -t "$IMAGE_REF" \
        "$CI_REGISTRY_IMAGE:$DOCKER_TAG-amd64" \
        "$CI_REGISTRY_IMAGE:$DOCKER_TAG-arm64"
      INSPECT_OUTPUT="$(docker buildx imagetools inspect "$IMAGE_REF")"
      echo "$INSPECT_OUTPUT"
      echo "$INSPECT_OUTPUT" | grep -q "linux/amd64" || { echo "Missing linux/amd64 in $IMAGE_REF"; exit 1; }
      echo "$INSPECT_OUTPUT" | grep -q "linux/arm64" || { echo "Missing linux/arm64 in $IMAGE_REF"; exit 1; }
  dependencies:
    - build_amd64
    - build_arm64
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest" || ($CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH)'

create_tagged_manifest:
  stage: manifest
  image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/docker
  tags:
    - amd64
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      IMAGE_REF="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      docker buildx imagetools create -t "$IMAGE_REF" \
        "$CI_REGISTRY_IMAGE:$DOCKER_TAG-amd64" \
        "$CI_REGISTRY_IMAGE:$DOCKER_TAG-arm64"
      INSPECT_OUTPUT="$(docker buildx imagetools inspect "$IMAGE_REF")"
      echo "$INSPECT_OUTPUT"
      echo "$INSPECT_OUTPUT" | grep -q "linux/amd64" || { echo "Missing linux/amd64 in $IMAGE_REF"; exit 1; }
      echo "$INSPECT_OUTPUT" | grep -q "linux/arm64" || { echo "Missing linux/arm64 in $IMAGE_REF"; exit 1; }
  dependencies:
    - build_amd64
    - build_arm64
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"'

cleanup_arch_images:
  stage: clean
  image: alpine:latest
  tags:
    - amd64
  script:
    - apk add --no-cache curl
    - curl --fail-with-body --location "https://github.com/regclient/regclient/releases/download/v0.6.1/regctl-linux-amd64" > /usr/bin/regctl
    - chmod 755 /usr/bin/regctl
    - regctl registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - regctl tag rm "$CI_REGISTRY_IMAGE:$DOCKER_TAG-amd64"
    - regctl tag rm "$CI_REGISTRY_IMAGE:$DOCKER_TAG-arm64"
    - |
      if printf '%s\n' "$CI_COMMIT_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$' && [ "${CI_COMMIT_TAG##*.}" -gt 0 ]; then
        PREVIOUS_PATCH_VERSION=$(expr "${CI_COMMIT_TAG##*.}" - 1 || true)
        PREVIOUS_TAG="${CI_COMMIT_TAG%.*}.$PREVIOUS_PATCH_VERSION"
        regctl tag rm "$CI_REGISTRY_IMAGE:$PREVIOUS_TAG" || true
      fi
  dependencies:
    - create_manifest
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest" || ($CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH)'
