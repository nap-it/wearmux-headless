# BSole Docker configuration
# This INI file sets environment variables and scripts to run in the container.

[env]
# Enable or disable zenoh publishing
ZENOH_ENABLE=1
# Run scripts sequentially or in parallel
RUN_MODE=sequential
# Optional: subset of sensors, comma-separated (example)
# ENABLED_SENSORS=acceleration,gyroscope
# Example of passing NPM script alias override
# NPM_SCRIPT_SENSORS=sensors

[scripts]
# List scripts to execute. Each key is a label; value is the npm script name (comma-separated supported)
run=sensors
# run=display
