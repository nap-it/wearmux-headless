# WearMux Headless - Audio / RTSP Configuration
# ============================================
# SAMPLE_RATE is audio samples per second; 16000 is the usual speech setting.
# BIT_DEPTH is the device sample depth in bits (commonly 16).
# CHANNELS is the RTSP output channel count (1 = mono, 2 = stereo).
# SAMPLE_FORMAT is the FFmpeg PCM input format, such as s16le or f32le.
# AUDIO_BITRATE is the RTSP encoder bitrate, e.g. 64k or 128k.
# Set RTSP_URL to the publish URL of an RTSP server to enable audio streaming.
# Set RTSP_ENABLE=0 to disable RTSP while leaving RTSP_URL configured.

[env]
# RTSP_URL=rtsp://127.0.0.1:8554/mic
# SAMPLE_RATE=16000
# CHANNELS=1
# SAMPLE_FORMAT=s16le
# AUDIO_BITRATE=64k
# 1 publishes raw audio chunks for external consumers; 0 publishes levels only.
# Raw audio requires MESSAGE_TRANSPORT=mqtt or zenoh.
MIC_RAW_ENABLE=1
# Minimum time between raw audio chunk batches, in milliseconds; 0 disables throttling.
# MIC_RAW_THROTTLE_MS=200
