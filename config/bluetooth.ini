# WearMux - Bluetooth Device Configuration
# ============================================
# Set DEVICE_NAME and/or DEVICE_ID for the device you want to use.
# Values below are placeholders; do not copy the example MAC addresses verbatim.
# If neither is set, the first discovered BrilliantSole device is used.

[env]
# --- Brilliant Frame ---
# DEVICE_NAME=Brilliant Frame <device-id>
# DEVICE_ID=AA:BB:CC:DD:EE:01

# --- Omi Glass ---
# DEVICE_NAME=Omi Glass <device-id>
# DEVICE_ID=AA:BB:CC:DD:EE:02

# --- Ukaton Insole ---
# DEVICE_NAME=Ukaton <device-id>
# DEVICE_ID=AA:BB:CC:DD:EE:03

# --- Insole side: 'left' or 'right' ---
# Tags all sensor events with the insole side so pressure / CoP data is labelled correctly.
#DEVICE_SIDE=left
