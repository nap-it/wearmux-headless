# WearMux Headless - Bluetooth Device Configuration
# ============================================
# In the sessions runtime, leave both filters unset to connect every nearby compatible device.
# Set DEVICE_ID or DEVICE_NAME to restrict discovery to one device. If both are set,
# DEVICE_ID is the effective filter. Use the name exactly as the device advertises it.

[env]
# --- Brilliant Frame ---
# DEVICE_NAME=Brilliant Frame 12
# DEVICE_ID=CE:59:C3:0F:4D:C9

# --- Omi Glass ---
# DEVICE_NAME=Omi Glass 20
# DEVICE_ID=8C:BF:EA:8E:49:B5

# --- Ukaton Insole ---
# DEVICE_NAME=Ukaton 44
# DEVICE_ID=ec:e3:34:74:b3:ba

# --- Optional side label for an insole ---
# Values: left or right. Adds that side label to every sensor event from this runtime.
#DEVICE_SIDE=left
