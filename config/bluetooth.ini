# WearMux Headless - Bluetooth Device Configuration
# ============================================
# Uncomment the DEVICE_NAME / DEVICE_ID pair for the device you want to use.
# If neither is set, the first discovered Brilliant Wear device is used.

[env]
# --- Brilliant Frame ---
# DEVICE_NAME=Brilliant Frame 12
# DEVICE_ID=CE:59:C3:0F:4D:C9

# --- Omi Glass ---
# DEVICE_NAME=Omi Glass 20
# DEVICE_ID=8C:BF:EA:8E:49:B5

# --- Ukaton Insole ---
# DEVICE_NAME=Ukaton 44
# DEVICE_ID=ec:e3:34:74:b3:ba

# --- Insole side: 'left' or 'right' ---
# Tags all sensor events with the insole side so pressure / CoP data is labelled correctly.
#DEVICE_SIDE=left
