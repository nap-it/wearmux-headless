# WearMux Headless - Camera Configuration
# ============================================

[env]
# --- Capture ---
# 1 captures continuously; 0 captures one image when the camera starts.
CAMERA_AUTO_PICTURE=1
# Delay between continuous captures, in milliseconds (0 starts the next capture immediately).
# CAMERA_AUTO_DELAY=1000
# 1 enables autofocus before each capture; 0 skips autofocus for faster capture.
CAMERA_AUTO_FOCUS=0
# Directory for saved JPEGs. Leave unset to stream/publish without writing images to disk.
# CAMERA_OUTPUT_DIR=./images
# Maximum wait for the device to return a capture command, in milliseconds.
CAMERA_CAPTURE_TIMEOUT_MS=5000
# Maximum wait for autofocus to return to idle, in milliseconds.
# CAMERA_FOCUS_IDLE_TIMEOUT_MS=3000

# --- Resolution / Quality ---
# Device-specific SDK resolution value. Use CAMERA_WIDTH/HEIGHT only if this is unset.
CAMERA_RESOLUTION=480
# JPEG quality value from 0 to 100; higher values use more bandwidth and storage.
CAMERA_QUALITY_FACTOR=60
# Ignore candidate images smaller than this many bytes; use 0 to disable the size filter.
CAMERA_MIN_IMAGE_BYTES=3000
# Legacy alias for CAMERA_QUALITY_FACTOR.
# CAMERA_QUALITY=80
# Some SDK commands can take longer than expected; timeout is in milliseconds.
CAMERA_COMMAND_TIMEOUT_MS=3000
# Legacy resolution fallback, used only when CAMERA_RESOLUTION is unset.
# CAMERA_WIDTH=320
# CAMERA_HEIGHT=320

# --- Viewer / browser preview ---
# 1 starts an HTTP browser viewer; 0 disables it. Open http://localhost:<port>/ in a browser.
CAMERA_VIEW_ENABLE=1
# 1 streams MJPEG; 0 serves the latest image for browser polling.
CAMERA_VIEW_MJPEG=1
# Bind address: 127.0.0.1 for this computer only, or 0.0.0.0 for other LAN devices too.
# CAMERA_VIEW_HOST=0.0.0.0
# TCP port from 1 to 65535. Additional camera sessions use consecutive ports.
# CAMERA_VIEW_PORT=8099

# --- Transport / runtime ---
# 1 publishes JPEG bytes in chunks for remote consumers; 0 publishes metadata only.
# Raw media requires MESSAGE_TRANSPORT=mqtt or zenoh (not none).
CAMERA_RAW_ENABLE=1
# Device camera sampling rate in Hz; supported values depend on the wearable.
CAMERA_RATE=5

# --- Latency evaluation (used when run=examples:latency) ---
# Number of camera samples collected by the latency example.
CAMERA_LATENCY_MEASUREMENTS=500
# Optional JSON output file for latency measurements.
# CAMERA_LATENCY_OUTPUT=./logs/camera-latency.json

# ============================================
# Device-specific tuning. Camera controls vary by model; use only values supported by
# the attached device. The active values below are applied to every camera that supports them.
# ============================================

# Brilliant Frame — manual tuning
# CAMERA_SHUTTER=6500
# CAMERA_GAIN=20
# CAMERA_RED_GAIN=400
# CAMERA_GREEN_GAIN=300
# CAMERA_BLUE_GAIN=400

# Omi Glass — extended controls (start with auto modes, disable for manual tuning)
# CAMERA_AUTO_WHITE_BALANCE_ENABLED=1
# CAMERA_AUTO_GAIN_ENABLED=1
# Exposure and auto-exposure flags are numeric SDK values (usually 0 or 1 for flags).
CAMERA_EXPOSURE=168
CAMERA_AUTO_EXPOSURE_ENABLED=0
# CAMERA_AUTO_EXPOSURE_LEVEL=0
# CAMERA_BRIGHTNESS=0
# CAMERA_SATURATION=0
# CAMERA_CONTRAST=0
# CAMERA_SHARPNESS=0
# Manual overrides (useful when auto modes are disabled)
# CAMERA_GAIN=0
# CAMERA_RED_GAIN=128
# CAMERA_GREEN_GAIN=128
# CAMERA_BLUE_GAIN=128
