# WearMux - Camera Configuration
# ============================================

[env]
# --- Capture ---
CAMERA_AUTO_PICTURE=1
# CAMERA_AUTO_DELAY=1000
CAMERA_AUTO_FOCUS=0
# CAMERA_IMAGE_FORMAT=jpg
# CAMERA_OUTPUT_DIR=./images          # leave commented to skip saving locally

# --- Resolution / Quality ---
CAMERA_RESOLUTION=480
CAMERA_QUALITY_FACTOR=60
CAMERA_MIN_IMAGE_BYTES=3000
# CAMERA_QUALITY=80
CAMERA_COMMAND_TIMEOUT_MS=3000
# CAMERA_WIDTH=320                    # use CAMERA_RESOLUTION unless you need asymmetric dims
# CAMERA_HEIGHT=320

# --- Viewer / browser preview ---
CAMERA_VIEW_ENABLE=1
CAMERA_VIEW_MJPEG=1
# CAMERA_VIEW_HOST=0.0.0.0
# CAMERA_VIEW_PORT=8099

# --- Transport / runtime ---
ZENOH_CAMERA_RAW_ENABLE=1
CAMERA_RATE=5
# CAMERA_DEBUG=1

# --- Latency evaluation (used when run=examples:latency) ---
CAMERA_LATENCY_MEASUREMENTS=500
# CAMERA_LATENCY_OUTPUT=./logs/camera-latency.json

# ============================================
# Device profiles (uncomment one block at a time)
# ============================================

# Brilliant Frame — manual tuning
# CAMERA_SHUTTER=6500
# CAMERA_GAIN=20
# CAMERA_RED_GAIN=400
# CAMERA_GREEN_GAIN=300
# CAMERA_BLUE_GAIN=400

# Omi Glass — extended controls (start with auto modes, disable for manual tuning)
# CAMERA_AUTO_WHITE_BALANCE_ENABLED=1
# CAMERA_AUTO_GAIN_ENABLED=1
CAMERA_EXPOSURE=168
CAMERA_AUTO_EXPOSURE_ENABLED=0
# CAMERA_AUTO_EXPOSURE_LEVEL=0
# CAMERA_BRIGHTNESS=0
# CAMERA_SATURATION=0
# CAMERA_CONTRAST=0
# CAMERA_SHARPNESS=0
# Manual overrides (useful when auto modes are disabled)
# CAMERA_GAIN=0
# CAMERA_RED_GAIN=128
# CAMERA_GREEN_GAIN=128
# CAMERA_BLUE_GAIN=128
