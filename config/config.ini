# WearMux - Application Settings & Scripts
# ============================================

[env]
NODE_ENV=production
DEBUG=0
RUN_MODE=sequential
DISPLAY_TIMING=0
DISPLAY_KEEP_ALIVE=1

# ============================================
[scripts]
# List scripts to execute on startup (comma-separated or one per line)
# Examples: sensors, microphone:rtsp, camera, display
run=sensors
