# WearMux Headless - Application Settings & Scripts
# ============================================

[env]
# Runtime environment: production or development.
NODE_ENV=production
# General log verbosity: 0 for normal output, 1 for debug details.
DEBUG=0
# Messaging backend for both publishing and receiving actions: mqtt, zenoh, or none.
# Use none to run local features such as the camera browser viewer without messaging.
MESSAGE_TRANSPORT=zenoh
# Enable the nod interaction session: acceleration sensor and display actions only;
# camera and microphone sessions are skipped.
# VRU_INTERACTION_ENABLED=1
# VRU_DEVICE_ID=<wearable-id>       # required when more than one suitable device is connected
# VRU_INTERACTION_TIMEOUT_MS=12000
# Bundled BrilliantWear Edge Impulse model; accept nod/shake scores above this value (0..1).
# VRU_GESTURE_CONFIDENCE=0.6
# Interaction mode fixes acceleration to the model's 20 ms interval (50 Hz),
# regardless of ENABLED_SENSORS / ACCELERATION_RATE. Inference runs on this host.
# Root for all message topics; defaults to bwear when unset.
# TOPIC_PREFIX=bwear
# MQTT broker URL, e.g. mqtt://127.0.0.1:1883 or mqtts://broker.example:8883.
# MQTT_BROKER_URL=mqtt://127.0.0.1:1883
# Zenoh router endpoint; use the endpoint exposed by your router or sidecar.
# ZENOH_ROUTER=tcp/127.0.0.1:7447
# Base64 characters per raw camera/audio chunk; values below 1024 are raised to 1024.
# RAW_CHUNK_SIZE=30000
# Set to 1 to print display transfer timing; 0 keeps normal output concise.
DISPLAY_TIMING=0
# Set to 1 to keep the display command alive after sending an image; 0 exits afterward.
DISPLAY_KEEP_ALIVE=1

# Optional display rendering values (uncomment only when needed):
# DISPLAY_PIXEL_DEPTH=2       # 1, 2, or 4 bits per pixel
# DISPLAY_BRIGHTNESS=medium   # veryLow, low, medium, high, veryHigh
# DISPLAY_FIT=contain         # contain, cover, fill, inside, outside
# DISPLAY_ALIGN=center       # top, bottom, left, right, center
# DISPLAY_X=0                 # horizontal origin in pixels
# DISPLAY_Y=0                 # vertical origin in pixels
# DISPLAY_INPUT_HEIGHT=120    # processing height in pixels
# DISPLAY_OUTPUT_HEIGHT=240   # on-device display height in pixels
# DISPLAY_WIDTH=240           # legacy size fallback; prefer input/output height
# DISPLAY_HEIGHT=240          # legacy size fallback; prefer input/output height

# ============================================
[scripts]
# Startup command(s): comma-separated or one run= line per command. Avoid starting
# standalone camera/sensor commands beside sessions when they would claim the same device.
# The session runtime discovers every compatible device and starts its capabilities.
# Legacy single-device commands remain available for focused manual use.
run=sessions
# Examples: run=camera, run=microphone:rtsp, run=examples:latency
# For a one-shot display command, use: run=display -- ./assets/collision_warning_8c.png
