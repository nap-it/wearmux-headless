# BSole Docker Configuration
# This INI file sets all environment variables and scripts configuration in one place

# ============================================
# [env] - Environment Variables
# ============================================
[env]
# Application Settings
NODE_ENV=production
DEBUG=0

# Bluetooth Device Configuration
DEVICE_NAME=Brilliant Frame 12
DEVICE_ID=CE:59:C3:0F:4D:C9 # Frame 12
# DEVICE_ID=8C:BF:EA:8E:49:B5 # Omi 20
USE_CUSTOM_NOBLE=true

# Zenoh Configuration
ZENOH_ENABLE=1
ZENOH_DOCKER_ROUTER=1

# Sensor Configuration
ENABLED_SENSORS=acceleration,magnetometer,orientation,tapDetector
# SENSOR_SAMPLE_RATE=50
# ACCELERATION_RATE=50
# GYROSCOPE_RATE=50
# MAGNETOMETER_RATE=50
# ORIENTATION_RATE=50

# Display Configuration
DISPLAY_TIMING=0

# ML / Gesture Detection Configuration
ML_GESTURES=0
ML_CONFIDENCE_THRESHOLD=0.6
# GESTURE_COOLDOWN_MS=1000

# Camera Configuration (uncomment if using camera)
# CAMERA_OUTPUT_DIR=./images
# CAMERA_AUTO_PICTURE=1
# CAMERA_VIEW_ENABLE=1
# CAMERA_VIEW_MJPEG=1
# CAMERA_AUTO_FOCUS=0
# CAMERA_RESOLUTION=320
# CAMERA_QUALITY_FACTOR=30
# CAMERA_AUTO_DELAY=1000

# Audio / RTSP Configuration (uncomment if using microphone)
# RTSP_URL=rtsp://0.0.0.0:8554/mic
# SAMPLE_RATE=16000
# CHANNELS=1
# SAMPLE_FORMAT=s16le
# AUDIO_BITRATE=64k

# Zenoh Advanced Configuration
# ZENOH_KEY_PREFIX=bsole/sensors
# ZENOH_ATTACH_ALL=1
# ZENOH_MIC_ENABLE=1
# ZENOH_MIC_KEY_PREFIX=bsole/microphone
# ZENOH_MIC_RAW_ENABLE=0
# ZENOH_CAMERA_ENABLE=1
# ZENOH_CAMERA_KEY_PREFIX=bsole/camera
# ZENOH_CAMERA_RAW_ENABLE=0

# Script Execution Mode
RUN_MODE=sequential

# ============================================
# [scripts] - Scripts to Execute
# ============================================
[scripts]
# List scripts to execute on startup (comma-separated or one per line)
# Examples: sensors, microphone:rtsp, camera, display
run=sensors
# run=camera
# run=microphone:rtsp
