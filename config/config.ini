# WearMux Headless - Application Settings & Scripts
# ============================================

[env]
NODE_ENV=production
DEBUG=0
MESSAGE_TRANSPORT=zenoh
# TOPIC_PREFIX=bwear
# MQTT_BROKER_URL=mqtt://127.0.0.1:1883
# ZENOH_ROUTER=tcp/127.0.0.1:7447
DISPLAY_TIMING=0
DISPLAY_KEEP_ALIVE=1

# ============================================
[scripts]
# List scripts to execute on startup (comma-separated or one per line)
# Examples: sensors, microphone:rtsp, camera, display
run=sensors
# run=camera
# run=microphone:rtsp
# run=examples:latency
# run=display -- ./assets/collision_warning_8c.png
