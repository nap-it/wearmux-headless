# BSole Docker Configuration
# This INI file sets all environment variables and scripts configuration in one place

# ============================================
# [env] - Environment Variables
# ============================================
[env]
# Application Settings
NODE_ENV=production
DEBUG=1

# Bluetooth Device Configuration
# DEVICE_NAME=Brilliant Frame 12
# DEVICE_ID=CE:59:C3:0F:4D:C9 # Frame 12
DEVICE_NAME=Omi Glass 20
DEVICE_ID=8C:BF:EA:8E:49:B5 # Omi 20
USE_CUSTOM_NOBLE=true

# Zenoh Configuration
ZENOH_ENABLE=1
ZENOH_DOCKER_ROUTER=1

# Sensor Configuration
ENABLED_SENSORS=acceleration,magnetometer,orientation,tapDetector
# SENSOR_SAMPLE_RATE=50
# ACCELERATION_RATE=50
# GYROSCOPE_RATE=50
# MAGNETOMETER_RATE=50
# ORIENTATION_RATE=50

# Display Configuration
DISPLAY_TIMING=0

# ML / Gesture Detection Configuration
ML_GESTURES=0
ML_CONFIDENCE_THRESHOLD=0.6
# GESTURE_COOLDOWN_MS=1000

# Camera Configuration
# Common capture controls
# Leave CAMERA_OUTPUT_DIR commented to avoid saving photos locally.
# CAMERA_OUTPUT_DIR=./images
CAMERA_AUTO_PICTURE=1
# CAMERA_AUTO_DELAY=1000
CAMERA_AUTO_FOCUS=0
# CAMERA_IMAGE_FORMAT=jpg
# CAMERA_QUALITY=80
CAMERA_RESOLUTION=320
CAMERA_QUALITY_FACTOR=30
# Viewer / browser preview
CAMERA_VIEW_ENABLE=1
CAMERA_VIEW_MJPEG=1
# CAMERA_VIEW_HOST=0.0.0.0
# CAMERA_VIEW_PORT=8099

# Latency evaluation example (used when run=examples:latency)
# Uses the camera env configs above. Set CAMERA_LATENCY_MEASUREMENTS
# to control how many frames to capture (0 = continuous, default 50).
CAMERA_LATENCY_MEASUREMENTS=500
# CAMERA_LATENCY_OUTPUT=./logs/camera-latency.json

# Camera transport / runtime behavior
# CAMERA_RATE=10
# CAMERA_DEBUG=1

# Fallback resolution syntax (use CAMERA_RESOLUTION unless you need this)
# CAMERA_WIDTH=320
# CAMERA_HEIGHT=320

# Device profile: Brilliant Frame / manual tuning style
# Uncomment only the fields you want to override.
# CAMERA_SHUTTER=6500
# CAMERA_GAIN=20
# CAMERA_RED_GAIN=400
# CAMERA_GREEN_GAIN=300
# CAMERA_BLUE_GAIN=400

# Device profile: Omi Glass / extended camera controls
# These map to the extra controls visible in the web SDK for Omi devices.
# Start with auto modes enabled, then disable them only if you want full manual tuning.
# CAMERA_AUTO_WHITE_BALANCE_ENABLED=1
# CAMERA_AUTO_GAIN_ENABLED=1
# CAMERA_EXPOSURE=168
# CAMERA_AUTO_EXPOSURE_ENABLED=1
# CAMERA_AUTO_EXPOSURE_LEVEL=0
# CAMERA_BRIGHTNESS=0
# CAMERA_SATURATION=0
# CAMERA_CONTRAST=0
# CAMERA_SHARPNESS=0

# Omi manual white balance / gain overrides
# Usually only useful when CAMERA_AUTO_WHITE_BALANCE_ENABLED=0 or CAMERA_AUTO_GAIN_ENABLED=0.
# CAMERA_GAIN=0
# CAMERA_RED_GAIN=128
# CAMERA_GREEN_GAIN=128
# CAMERA_BLUE_GAIN=128

# Audio / RTSP Configuration (uncomment if using microphone)
# RTSP_URL=rtsp://0.0.0.0:8554/mic
# SAMPLE_RATE=16000
# CHANNELS=1
# SAMPLE_FORMAT=s16le
# AUDIO_BITRATE=64k

# Zenoh Advanced Configuration
# ZENOH_KEY_PREFIX=bsole/sensors
# ZENOH_ATTACH_ALL=1
# ZENOH_MIC_ENABLE=1
# ZENOH_MIC_KEY_PREFIX=bsole/microphone
# ZENOH_MIC_RAW_ENABLE=0
# ZENOH_CAMERA_ENABLE=1
# ZENOH_CAMERA_KEY_PREFIX=bsole/camera
# ZENOH_CAMERA_RAW_ENABLE=0

# Script Execution Mode
RUN_MODE=sequential

# ============================================
# [scripts] - Scripts to Execute
# ============================================
[scripts]
# List scripts to execute on startup (comma-separated or one per line)
# Examples: sensors, microphone:rtsp, camera, display
# run=sensors
# run=camera
# run=microphone:rtsp
run=examples:latency
