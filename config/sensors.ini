# WearMux Headless - Sensor Configuration
# ============================================

[env]
# Optional comma-separated sensor names. Leave unset in the sessions runtime to enable
# every sensor supported by each connected device. Unknown or unsupported names are skipped.
# Uncomment one profile to limit sensor capture to a known set:
#
# Omi Glass / Brilliant Frame 12 (tap detection only):
# ENABLED_SENSORS=tapDetector
#
# Brilliant Frame (IMU):
# ENABLED_SENSORS=acceleration,magnetometer,orientation,tapDetector
#
# Ukaton Insole (full IMU + pressure):
# ENABLED_SENSORS=acceleration,magnetometer,orientation,tapDetector,pressure,gravity,linearAcceleration,gyroscope,gameRotation,rotation,activity,stepCounter

# Per-sensor device sampling rates. Use a positive rate in Hz or a period such as "20ms".
# The SDK expects rates in 5 Hz steps; WearMux rounds configured rates to the nearest step.
# Rates are also used to limit how often each sensor event is published.
# ACCELERATION_RATE=50
# GRAVITY_RATE=50
# LINEAR_ACCELERATION_RATE=50
# GYROSCOPE_RATE=50
# MAGNETOMETER_RATE=50
# GAME_ROTATION_RATE=50
# ROTATION_RATE=50
# ORIENTATION_RATE=50
# ACTIVITY_RATE=5
# STEP_COUNTER_RATE=5
# TAP_DETECTOR_RATE=5
# PRESSURE_RATE=50
