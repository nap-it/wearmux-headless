# BSole - Sensor Configuration
# ============================================

[env]
# Comma-separated list of sensors to enable.
# Available: acceleration, magnetometer, orientation, tapDetector,
#            gyroscope, linearAcceleration, gameRotation, rotation, pressure
ENABLED_SENSORS=acceleration,magnetometer,orientation,tapDetector,pressure

# Per-sensor device sample rates (Hz, or e.g. "20ms").
# Device rates must be multiples of 5 Hz.
# SENSOR_SAMPLE_RATE=50
# ACCELERATION_RATE=50
# GYROSCOPE_RATE=50
# MAGNETOMETER_RATE=50
# ORIENTATION_RATE=50
# LINEAR_ACCELERATION_RATE=50
# GAME_ROTATION_RATE=50
# ROTATION_RATE=50
# TAP_DETECTOR_RATE=5
# PRESSURE_RATE=50
