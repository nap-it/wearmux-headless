# WearMux - Sensor Configuration
# ============================================

[env]
# Comma-separated list of sensors to enable.
# Uncomment the profile that matches your device:
#
# Omi Glass / Brilliant Frame (tap detection only):
# ENABLED_SENSORS=tapDetector
#
# Brilliant Frame (IMU):
# ENABLED_SENSORS=acceleration,magnetometer,orientation,tapDetector
#
# Ukaton Insole (full IMU + pressure):
# ENABLED_SENSORS=acceleration,magnetometer,orientation,tapDetector,pressure,gravity,linearAcceleration,gyroscope,gameRotation,rotation,activity,stepCounter

# Per-sensor device sample rates (Hz, or e.g. "20ms").
# Device rates must be multiples of 5 Hz.
# ACCELERATION_RATE=50
# GRAVITY_RATE=50
# LINEAR_ACCELERATION_RATE=50
# GYROSCOPE_RATE=50
# MAGNETOMETER_RATE=50
# GAME_ROTATION_RATE=50
# ROTATION_RATE=50
# ORIENTATION_RATE=50
# ACTIVITY_RATE=5
# STEP_COUNTER_RATE=5
# TAP_DETECTOR_RATE=5
# PRESSURE_RATE=50
