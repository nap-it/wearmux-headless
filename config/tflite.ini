# WearMux - On-Device TFLite Inference Configuration
# ============================================

[env]
# Path to .tflite model file (relative to the repository root or absolute)
TFLITE_MODEL=sensors/model/model.tflite

# Task type: classification | regression
TFLITE_TASK=classification

# Input sensors the model expects (comma-separated)
# Supported: gyroscope, linearAcceleration, pressure, magnetometer
TFLITE_SENSORS=gyroscope,linearAcceleration

# Input sample rate in Hz (must be a multiple of 5, max 200)
TFLITE_SAMPLE_RATE=20

# Class labels for classification (comma-separated, must match model output order)
TFLITE_CLASSES=idle,kick,stomp,tap

# Minimum confidence to display a result (0.0 – 1.0)
TFLITE_THRESHOLD=0.7

# Delay in ms before inference starts after the sensor capture window ends
TFLITE_CAPTURE_DELAY=500

# Override model name (defaults to filename without .tflite extension)
# TFLITE_NAME=myGestureModel
