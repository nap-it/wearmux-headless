# WearMux Headless - Wear OS Configuration
# ============================================
# Wear OS watches run the companion app in wearos/ and connect to this host over Wi-Fi.
# The watch and this host must be on the same network. Leave WEAROS_PORT unset to disable.

[env]
# TCP port for incoming watch WebSocket connections; set the same port in the watch app.
# WEAROS_PORT=8765

# Bind address for the watch listener; defaults to every interface.
# WEAROS_HOST=0.0.0.0
