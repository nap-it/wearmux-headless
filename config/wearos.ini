# WearMux Headless - Wear OS Configuration
# ============================================
# Wear OS watches run the WearMux watch app (wearmux-android, PC tab) and connect to this host over Wi-Fi.
# The watch and this host must be on the same network. Leave WEAROS_PORT unset to disable.

[env]
# Port for incoming watch WebSocket connections (TCP); the same number answers watch discovery on UDP.
# WEAROS_PORT=8765

# Bind address for the watch listener; defaults to every interface.
# WEAROS_HOST=0.0.0.0
