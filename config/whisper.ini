# WearMux - Whisper Speech-to-Text Configuration
# ============================================
# Run whisper/runner.py to transcribe microphone audio in real time.
#
# Prerequisites:
#   1. microphone/index.js must be running with ZENOH_MIC_RAW_ENABLE=1
#   2. A Zenoh router must be reachable at ZENOH_ROUTER

[env]
# ── Model ──────────────────────────────────────────────────────────────────────
# Tradeoff: tiny = fastest / lowest accuracy; large-v3 = slowest / best accuracy
# On CPU (int8): tiny ~1-2s/window, base ~2-4s/window, small ~5-10s/window
WHISPER_MODEL=tiny
WHISPER_DEVICE=cpu
WHISPER_COMPUTE_TYPE=int8

# ── Language ───────────────────────────────────────────────────────────────────
# Leave empty for automatic language detection (adds ~0.3s per window).
# Set to a BCP-47 code to skip detection: en, pt, es, fr, de, ...
# WHISPER_LANGUAGE=en

# When WHISPER_LANGUAGE is empty, sample this many windows before locking to the
# majority-voted language. Higher = more reliable detection, more latency before lock.
# WHISPER_AUTODETECT_WINDOWS=3

# Re-detect language every N windows after locking; 0 = lock forever.
# WHISPER_AUTODETECT_EVERY=0

# ── Audio window ───────────────────────────────────────────────────────────────
# Seconds of audio to accumulate before each inference call.
# Shorter = lower latency, more fragmented transcripts.
# Longer = better accuracy, more context for the model.
WHISPER_WINDOW_S=5

# Overlap fraction (0–0.9): keep this fraction of each window as the start of
# the next. Reduces cut-off words at window boundaries; costs 1/(1-overlap)×
# more inference calls. 0.5 = 50% overlap (2× cost). Disabled by default.
# WHISPER_OVERLAP=0

# ── Quality ────────────────────────────────────────────────────────────────────
# Discard windows where all segments exceed this no-speech probability (0–1).
# Suppresses hallucinations on silent windows ("Thank you.", "Bye." artifacts).
WHISPER_NO_SPEECH_THRESHOLD=0.6

# Include per-word start/end timestamps in transcript payload.
# Enables synchronized subtitle display on Frame glasses. ~10-20% slower.
# WHISPER_WORD_TIMESTAMPS=0

# ── Transport ──────────────────────────────────────────────────────────────────
# Set MQTT_ENABLE=1 to subscribe via MQTT instead of Zenoh.
# Requires paho-mqtt (included in requirements.txt).
# MQTT_ENABLE=0
# MQTT_BROKER=localhost
# MQTT_PORT=1883

# ── Zenoh keys ─────────────────────────────────────────────────────────────────
# WHISPER_PUB_KEY=bsole/whisper/transcript
# ZENOH_SUB_MIC=bsole/microphone/raw/**

# ── Router ─────────────────────────────────────────────────────────────────────
ZENOH_ROUTER=tcp/127.0.0.1:7447
