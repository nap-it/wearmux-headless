# WearMux - WiFi Configuration
# ============================================
# To provision WiFi credentials onto the device (requires BLE), run:
#   npm run wifi:setup
#
# After provisioning, set DEVICE_IP below to connect directly via WiFi
# and skip BLE scanning entirely.

[env]
# Device IP address — set this after running wifi:setup to enable WiFi transport.
# When set, all scripts (sensors, tflite, etc.) connect via WiFi instead of BLE.
# DEVICE_IP=192.168.1.100

# Transport type: websocket (default) or udp
# DEVICE_TRANSPORT=websocket

# Use secure WebSocket (wss://) — requires certificates on the device
# DEVICE_WIFI_SECURE=0

# --- Provisioning credentials (used only by wifi:setup) ---
# WIFI_SSID=MyNetwork
# WIFI_PASSWORD=MyPassword
