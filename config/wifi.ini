# WearMux Headless - WiFi Configuration
# ============================================
# To provision WiFi credentials onto the device (requires BLE), run:
#   npm run wifi:setup
#
# After provisioning, set DEVICE_IP below to connect directly via WiFi instead of
# using BLE for that connection. The sessions runtime can still discover BLE devices.

[env]
# Device IP address — set this after running wifi:setup to add a WiFi device connection.
# In standalone single-device commands, this selects WiFi instead of BLE scanning.
# DEVICE_IP=192.168.1.100

# Connection protocol: websocket (default) or udp.
# DEVICE_TRANSPORT=websocket

# Use secure WebSocket (wss://): 1 enables TLS (requires device certificates), 0 disables it.
# DEVICE_WIFI_SECURE=0

# --- Provisioning credentials (used only by wifi:setup) ---
# WIFI_SSID=MyNetwork
# WIFI_PASSWORD=MyPassword
