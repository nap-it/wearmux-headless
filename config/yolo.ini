# WearMux - YOLO Object Detection Configuration
# ============================================
# Run yolo/runner.py to detect objects in camera frames in real time.
#
# Prerequisites:
#   1. camera/index.js must be running with ZENOH_CAMERA_RAW_ENABLE=1
#   2. A Zenoh router must be reachable at ZENOH_ROUTER

[env]
# ── Model ──────────────────────────────────────────────────────────────────────
# yolov8n = fastest / smallest (3MB); yolov8s, yolov8m, yolov8l, yolov8x for
# progressively more accuracy at the cost of inference speed.
# On CPU: yolov8n ~30-80ms/frame at 320px; yolov8s ~80-200ms/frame.
YOLO_MODEL=yolov8m.pt
YOLO_DEVICE=cuda

# ── Detection thresholds ───────────────────────────────────────────────────────
# Confidence: detections below this are dropped (0–1).
YOLO_CONFIDENCE=0.40
# IOU: non-maximum suppression threshold for overlapping boxes (0–1).
YOLO_IOU=0.45

# ── Inference size ─────────────────────────────────────────────────────────────
# Resize longest side to this before inference. Smaller = faster, less accurate.
# Must be a multiple of 32. 320 is a good default for real-time use.
YOLO_INPUT_SIZE=640

# ── Class filter ───────────────────────────────────────────────────────────────
# Comma-separated COCO class IDs to detect; empty = detect all 80 classes.
# Examples: 0=person, 1=bicycle, 2=car, 15=cat, 16=dog
YOLO_CLASSES=0,1,2

# ── Transport ──────────────────────────────────────────────────────────────────
# Set MQTT_ENABLE=1 to subscribe via MQTT instead of Zenoh.
# Requires paho-mqtt (included in requirements.txt).
# MQTT_ENABLE=0
# MQTT_BROKER=localhost
# MQTT_PORT=1883

# ── Zenoh keys ─────────────────────────────────────────────────────────────────
# YOLO_PUB_KEY=bsole/yolo/detections
# ZENOH_SUB_CAMERA=bsole/camera/raw/**

# ── Router ─────────────────────────────────────────────────────────────────────
ZENOH_ROUTER=tcp/127.0.0.1:7447

# ── Annotated output ───────────────────────────────────────────────────────────
# Publish JPEG frames with detection boxes drawn on them to bsole/yolo/annotated.
YOLO_PUBLISH_ANNOTATED=1
# YOLO_ANNOTATED_PUB_KEY=bsole/yolo/annotated
