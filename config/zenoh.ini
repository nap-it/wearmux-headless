# WearMux - Zenoh Middleware Configuration
# ============================================

[env]
ZENOH_ENABLE=1

# Router endpoint override (default: tcp/127.0.0.1:7447 from config/peer.json5)
# Set this on hosts that need to reach a router on a different machine.
# Example (RPi connecting to a PC router on the LAN):
# ZENOH_ROUTER=tcp/127.0.0.1:7447

# Advanced / optional overrides
# The default bsole/* key namespace is retained for compatibility with the development branch.
# ZENOH_KEY_PREFIX=bsole/sensors
# ZENOH_ATTACH_ALL=1

# Microphone publishing
ZENOH_MIC_ENABLE=1
# ZENOH_MIC_KEY_PREFIX=bsole/microphone
ZENOH_MIC_RAW_ENABLE=1
# ZENOH_MIC_RAW_THROTTLE_MS=200

# Camera publishing
# ZENOH_CAMERA_ENABLE=1
# ZENOH_CAMERA_KEY_PREFIX=bsole/camera
ZENOH_CAMERA_RAW_ENABLE=1
