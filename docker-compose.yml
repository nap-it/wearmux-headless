services:
  # Zenoh Router - Message broker
  zenoh-router:
    image: eclipse/zenoh:1.6.1
    container_name: zenoh-router
    command: -c /zenoh/router.json5
    ports:
      - "7447:7447" # TCP port for zenoh
      # - "8000:8000"  # REST API (optional, disabled to avoid conflicts)
    volumes:
      - ./config/router.json5:/zenoh/router.json5:ro
    environment:
      - RUST_LOG=${ZENOH_LOG_LEVEL:-info}
    networks:
      - wearmux-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pgrep zenohd || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # WearMux Headless - Main application
  wearmux-headless:
    image: ${WEARMUX_IMAGE:-wearmux-headless:local}
    build:
      context: .
    container_name: wearmux-headless
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      - MESSAGE_TRANSPORT
      - TOPIC_PREFIX
      - MQTT_BROKER_URL
      - VRU_INTERACTION_ENABLED
      - VRU_DEVICE_ID
      - VRU_INTERACTION_TIMEOUT_MS
      - VRU_GESTURE_WINDOW_MS
      - VRU_NOD_THRESHOLD_DEG
      - VRU_SHAKE_THRESHOLD_DEG
      - VRU_GESTURE_DEADBAND_DEG
      - ZENOH_ROUTER=${ZENOH_ROUTER:-tcp/127.0.0.1:7447}
    volumes:
      - ./config:/config:ro
      - ./config/peer.json5:/app/zenoh/peer.json5:ro
      # Data persistence (optional)
      - ./training-data:/app/training-data
      - ./logs:/app/logs
      # Display assets (if using display module)
      - ./display/assets:/app/display/assets:ro
      # Camera output (if using camera module)
      - ./images:/app/images

    # BLE access requires special permissions
    privileged: ${PRIVILEGED:-true}
    network_mode: host # Required for BLE discovery

    # Alternative to privileged mode (more secure, but may not work for all systems)
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    #   - SYS_ADMIN
    # security_opt:
    #   - seccomp:unconfined
    # devices:
    #   - "/dev/bus/usb:/dev/bus/usb"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "node", "-e", "console.log('healthy')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    network_mode: host # Required for RTSP access from host
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8554 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  wearmux-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  training-data:
  logs:
